name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — catches a broken dependency resolution or runner image change with no code change
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  check:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 36 and build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (fails on errors, warnings are tolerated)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  assemble:
    name: Debug APK and artifact invariants
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 36 and build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read the version of record
        id: version
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          C=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*= ([0-9]+)/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "Version of record: $V ($C)"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Invariants — no INTERNET, designed permissions only, version match
        run: ./scripts/verify-apk.sh "dist/AutoClick-${{ steps.version.outputs.name }}-debug.apk" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}"

      - name: Invariants — dist carries only the current version
        run: |
          V="${{ steps.version.outputs.name }}"
          stray=$(ls dist/*.apk 2>/dev/null | grep -v "AutoClick-${V}" || true)
          if [ -n "$stray" ]; then
            echo "FAIL: stale APK(s) in dist/:"
            echo "$stray"
            exit 1
          fi
          echo "OK: dist holds only AutoClick-${V}*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick-${{ steps.version.outputs.name }}-debug
          path: dist/AutoClick-${{ steps.version.outputs.name }}-debug.apk
          retention-days: 14
          if-no-files-found: error
