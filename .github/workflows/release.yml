name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v1.2.0)"
        required: true
      publish:
        description: "Publish / update the GitHub Release. Leave false to only verify."
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "FAIL: '$TAG' is not a v<major>.<minor>.<patch> tag"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships an SDK; setup-android@v3 is skipped because it
      # tries to install the removed `tools` package and fails on current images.
      - name: Android SDK 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using $SDKMGR (root $SDK)"
          [ -n "$SDKMGR" ] || { echo "FAIL: sdkmanager not found"; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read the version of record
        id: version
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          C=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*= ([0-9]+)/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"

      - name: Guard — tag matches versionName
        run: |
          if [ "${{ steps.tag.outputs.version }}" != "${{ steps.version.outputs.name }}" ]; then
            echo "FAIL: tag v${{ steps.tag.outputs.version }} but versionName is ${{ steps.version.outputs.name }}."
            echo "      Bump versionCode/versionName, or tag the right commit."
            exit 1
          fi
          echo "OK: tag and versionName both ${{ steps.version.outputs.name }}"

      - name: Guard — tag points at main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "FAIL: ${{ steps.tag.outputs.tag }} is not on main — releases come from trunk only."
            exit 1
          fi
          echo "OK: ${{ steps.tag.outputs.tag }} is on main"

      # Notes live next to the code that ships them. A tag created before the notes file
      # existed (v1.2.0 predates docs/releases/) falls back to the copy on main, which is
      # still reviewed — but the run says so loudly instead of silently pretending.
      - name: Guard — release notes exist
        id: notes
        run: |
          V="${{ steps.version.outputs.name }}"
          NOTES="docs/releases/${V}.md"
          if [ -s "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "OK: using $NOTES (from the tag)"
          elif git cat-file -e "origin/main:$NOTES" 2>/dev/null; then
            git show "origin/main:$NOTES" > "$RUNNER_TEMP/notes-${V}.md"
            echo "path=$RUNNER_TEMP/notes-${V}.md" >> "$GITHUB_OUTPUT"
            echo "::warning::$NOTES is not in ${{ steps.tag.outputs.tag }}; using the copy on main"
            {
              echo "> **Note** release notes were taken from \`main\`, not from the tag,"
              echo "> because this tag predates \`$NOTES\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: $NOTES is missing on the tag and on main. Notes are reviewed like code."
            exit 1
          fi

      # The gate itself comes from trunk, not from the tag: a tag can predate a check
      # (v1.2.0 predates scripts/verify-apk.sh), and the checks that matter are the
      # current ones, while the artifact is whatever that tag built.
      - name: Prepare the artifact gate from trunk
        id: gates
        run: |
          git show origin/main:scripts/verify-apk.sh > "$RUNNER_TEMP/verify-apk.sh"
          chmod +x "$RUNNER_TEMP/verify-apk.sh"
          echo "path=$RUNNER_TEMP/verify-apk.sh" >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/verify-apk.sh"
          echo "OK: gate script taken from main"

      - name: Unit tests and lint (same gate as CI)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Assemble release (R8, debug-keystore signed)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Invariants — artifact is honest
        run: "${{ steps.gates.outputs.path }}" "dist/AutoClick-${{ steps.version.outputs.name }}.apk" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" --release

      - name: Checksums
        run: |
          cd dist
          sha256sum "AutoClick-${{ steps.version.outputs.name }}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          V="${{ steps.version.outputs.name }}"
          NOTES="${{ steps.notes.outputs.path }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists — updating assets and notes"
            gh release upload "$TAG" "dist/AutoClick-${V}.apk" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "AutoClick ${V}" \
              --notes-file "$NOTES" \
              "dist/AutoClick-${V}.apk" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "asset: \(.name) (\(.size) bytes)"' --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          {
            echo "### AutoClick ${{ steps.version.outputs.name }}"
            echo ""
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- artifact: \`AutoClick-${{ steps.version.outputs.name }}.apk\`"
            echo "- sha256: \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\`"
            echo "- published: \`${{ github.event_name == 'push' || inputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
